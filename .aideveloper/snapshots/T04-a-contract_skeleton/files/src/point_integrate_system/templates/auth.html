{% extends "base.html" %}
{% block title %}ログイン - ポイント統合システム{% endblock %}
{% block content %}
<section class="auth-card" id="login-screen">
  <h1>ログイン</h1>
  <p class="lead">登録済みのメールアドレスとパスワードを入力してください。</p>
  <form method="post" action="{{ url_for('auth.login') }}" class="auth-form js-auth-form" novalidate>
    <input type="hidden" name="next" value="{{ next_url or '' }}">
    <div class="form-group">
      <label for="email">メールアドレス</label>
      <input id="email" name="email" type="email" autocomplete="email" required maxlength="255" value="{{ email or '' }}">
    </div>
    <div class="form-group">
      <label for="password">パスワード</label>
      <div class="password-row">
        <input id="password" name="password" type="password" autocomplete="current-password" required minlength="8" maxlength="128">
        <button type="button" class="button secondary js-toggle-password" data-target="#password">表示</button>
      </div>
    </div>
    <div class="form-actions">
      <button type="submit" class="button primary">ログイン</button>
      <a class="button link-button" href="{{ url_for('auth.register') }}">新規登録へ</a>
    </div>
  </form>
  <aside class="dev-account-box">
    <h2>開発用アカウント</h2>
    <p>ローカルテストでは <code>dev.user@example.com</code> / <code>Password123!</code> を利用できます。</p>
  </aside>
</section>
{% endblock %}
