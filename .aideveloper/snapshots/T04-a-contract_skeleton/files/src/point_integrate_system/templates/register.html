{% extends "base.html" %}
{% block title %}新規登録 - ポイント統合システム{% endblock %}
{% block content %}
<section class="auth-card" id="register-screen">
  <h1>新規登録</h1>
  <p class="lead">利用者情報を登録して、ポイント統合システムを開始します。</p>
  <form method="post" action="{{ url_for('auth.register') }}" class="auth-form js-auth-form" novalidate>
    <div class="form-group">
      <label for="name">氏名</label>
      <input id="name" name="name" type="text" autocomplete="name" required maxlength="120" value="{{ name or '' }}">
    </div>
    <div class="form-group">
      <label for="email">メールアドレス</label>
      <input id="email" name="email" type="email" autocomplete="email" required maxlength="255" value="{{ email or '' }}">
    </div>
    <div class="form-group">
      <label for="password">パスワード</label>
      <div class="password-row">
        <input id="password" name="password" type="password" autocomplete="new-password" required minlength="8" maxlength="128" aria-describedby="password-help">
        <button type="button" class="button secondary js-toggle-password" data-target="#password">表示</button>
      </div>
      <p id="password-help" class="field-help">8文字以上で、英字と数字を含めてください。</p>
    </div>
    <div class="form-actions">
      <button type="submit" class="button primary">登録する</button>
      <a class="button link-button" href="{{ url_for('auth.login') }}">ログインへ</a>
    </div>
  </form>
</section>
{% endblock %}
