[project]
name = "point-integrate-system"
version = "0.1.0"
description = "ポイント統合システムのFlaskアプリケーション"
requires-python = ">=3.11"
dependencies = [
  "Flask>=3.0,<4.0",
]

[project.optional-dependencies]
test = [
  "pytest>=8.0,<9.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
line-length = 100
