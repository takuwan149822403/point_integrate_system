<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}ポイント統合システム{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
  </head>
  <body>
    <header class="site-header">
      <div class="site-header__inner">
        <a class="site-logo" href="{{ url_for('auth.menu') if session.get('user_id') else url_for('auth.login') }}">ポイント統合システム</a>
        <nav class="site-nav" aria-label="主要ナビゲーション">
          {% if session.get('user_id') %}
            <a href="{{ url_for('auth.menu') }}">メニュー</a>
            <a href="{{ url_for('auth.logout') }}" data-confirm-logout="true">ログアウト</a>
          {% else %}
            <a href="{{ url_for('auth.login') }}">ログイン</a>
            <a href="{{ url_for('auth.register') }}">登録</a>
          {% endif %}
        </nav>
      </div>
    </header>

    <main class="page-shell">
      {% block content %}{% endblock %}
    </main>

    <footer class="site-footer">
      <small>開発・テスト用の認証入口です。本番の認証情報は環境変数と永続化基盤で管理してください。</small>
    </footer>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
  </body>
</html>
