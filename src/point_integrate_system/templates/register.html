{% extends "base.html" %}

{% block title %}ユーザー登録 - ポイント統合システム{% endblock %}

{% block content %}
<section class="card auth-card" aria-labelledby="register-title">
  <h1 id="register-title">ユーザー登録</h1>
  <p class="lead">ポイント統合システムを利用するユーザーを登録します。</p>
  <form class="auth-form" method="post" action="{{ url_for('auth.register') }}" novalidate>
    <div class="form-field">
      <label for="name">名前</label>
      <input id="name" name="name" type="text" autocomplete="name" maxlength="120" required>
    </div>
    <div class="form-field">
      <label for="email">メールアドレス</label>
      <input id="email" name="email" type="email" autocomplete="email" maxlength="255" required>
    </div>
    <div class="form-field">
      <label for="password">パスワード</label>
      <input id="password" name="password" type="password" autocomplete="new-password" maxlength="128" required aria-describedby="password-help">
      <small id="password-help" class="helper-text">8文字以上で、英字と数字を含めてください。</small>
    </div>
    <div class="form-field">
      <label for="confirm_password">確認用パスワード</label>
      <input id="confirm_password" name="confirm_password" type="password" autocomplete="new-password" maxlength="128" required>
    </div>
    <div class="button-row">
      <button class="button button-primary" type="submit">登録してメニューへ</button>
      <a class="button button-secondary" href="{{ url_for('auth.login') }}">ログインへ戻る</a>
    </div>
  </form>
</section>
{% endblock %}
